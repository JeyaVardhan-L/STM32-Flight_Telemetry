<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STM32 Flight Telemetry</title>
  <meta name="description" content="Live 3D attitude dashboard for an STM32 Blue Pill + MPU6050, streamed straight into the browser with Web Serial. Includes a demo mode that works without hardware.">
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2308090a'/%3E%3Ccircle cx='8' cy='8' r='3' fill='none' stroke='%23f7f8f8' stroke-width='1.5'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="web/style.css">
</head>
<body>

  <header class="nav">
    <div class="brand">
      <span id="statusDot" class="status-dot" data-state="idle" aria-hidden="true"></span>
      STM32 Flight Telemetry
      <span class="tag">v2</span>
    </div>
    <nav class="nav-links" aria-label="Project links">
      <a class="link" href="https://github.com/JeyaVardhan-L/STM32-Flight_Telemetry">Source</a>
      <a class="link" href="https://github.com/JeyaVardhan-L/STM32-Flight_Telemetry/blob/main/Report.md">Dev log</a>
    </nav>
    <div class="nav-spacer"></div>
    <div class="controls">
      <select id="modelSelect" class="select" aria-label="3D model">
        <option value="drone">Quadcopter</option>
        <option value="satellite">Satellite</option>
        <option value="rocket">Launch vehicle</option>
        <option value="slab">Hardware workbench</option>
      </select>
      <button id="btnTare" class="btn btn-ghost" title="Zero the current orientation">Tare</button>
      <button id="btnDemo" class="btn btn-ghost">Play demo</button>
      <button id="btnConnect" class="btn">Connect device</button>
    </div>
  </header>

  <main class="workspace">
    <section class="readouts" aria-label="Attitude readouts">
      <div class="card readout">
        <div class="readout-head">
          <span class="readout-label">Pitch <span>· X</span></span>
          <span class="readout-value" id="valPitch">0.0°</span>
        </div>
        <div class="readout-chart"><canvas id="chartPitch" aria-hidden="true"></canvas></div>
      </div>
      <div class="card readout">
        <div class="readout-head">
          <span class="readout-label">Roll <span>· Y</span></span>
          <span class="readout-value" id="valRoll">0.0°</span>
        </div>
        <div class="readout-chart"><canvas id="chartRoll" aria-hidden="true"></canvas></div>
      </div>
      <div class="card readout">
        <div class="readout-head">
          <span class="readout-label">Yaw <span>· Z</span></span>
          <span class="readout-value" id="valYaw">0.0°</span>
        </div>
        <div class="readout-chart"><canvas id="chartYaw" aria-hidden="true"></canvas></div>
      </div>
    </section>

    <section id="viewport" class="card viewport" aria-label="3D orientation view">
      <div class="hud">
        <span id="tagSource" class="pill-tag"></span>
        <span id="tagTare" class="pill-tag"></span>
      </div>
      <div id="emptyState" class="empty">
        <h2>No device connected</h2>
        <p>Plug in the Blue Pill (through the USB-serial bridge) and connect, or play the demo flight to see the dashboard without hardware.</p>
        <p id="emptyNote" class="note"></p>
        <div class="actions">
          <button id="emptyDemo" class="btn">Play demo flight</button>
          <button id="emptyConnect" class="btn btn-ghost">Connect device</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusMsg" class="status-msg" role="status" aria-live="polite">Loading…</span>
    <span id="rate" class="metric">— Hz</span>
    <span id="count" class="metric">0 samples</span>
    <button id="btnSmooth" class="btn btn-ghost" aria-pressed="false" title="Extra exponential smoothing in the browser (adds a little lag)">Smooth</button>
    <button id="btnRecord" class="btn" aria-pressed="false" title="Record raw samples and save them as CSV" disabled>Record</button>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="web/models.js"></script>
  <script src="web/telemetry.js"></script>
  <script src="web/app.js"></script>
</body>
</html>
